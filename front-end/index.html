<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK LIST</title>
    <script src="scrpts.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete" />
</head>
<body>
    <div class="container">
        <div class="area inicial">
            <h1>Check list</h1>
        </div>

        <div class="area preenchimento">
            <div class="forms">
                <input type="text" id="campo" placeholder="Digite a tarefa aqui...">
                <button type="submit" id="add" >ADICIONAR</button>
                <button id="apagar">APAGAR TUDO</button>
            </div>
            <p id="erro">Campo vazio!</p>
        </div>

        <div class="area lista">
            <div class="tarefa">
                <div class="task">
                    <input type="checkbox" name="check" class="concluido">
                    <span class="texto-tarefa">Correr</span>
                </div>
                <button type="button" class="excluir-task"><span class="material-symbols-outlined">delete</span></button>
            </div>
            <div class="tarefa">
                <div class="task">
                    <input type="checkbox" name="" class="concluido">
                    <span class="texto-tarefa">Correr</span>
                </div>
                <button type="button" class="excluir-task" aria-label="Excluir tarefa">
                    <svg
                        class="icone-lixeira"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M4 6h16" />
                        <path d="M9 6V4h6v2" />
                        <path d="M6.5 6l.7 14h9.6l.7-14" />
                        <path d="M10 10v7" />
                        <path d="M14 10v7" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
