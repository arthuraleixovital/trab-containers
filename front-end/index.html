<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="scrpts.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="area inicial">
            <h1>Check list dos cabas</h1>
        </div>

        <div class="area preenchimento">
            <input type="text" placeholder="Digite a tarefa aqui...">
            <button type="submit">ADD</button>
            <button>APAGAR</button>
        </div>

        <div class="area lista">
            <div class="lista">
                <div id="tarefa">
                    <input type="checkbox" name="" id="concluido">
                    <h2>Correr</h2>
                    <button type="button">APAGAR</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
