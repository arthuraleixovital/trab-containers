<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK LIST</title>
    <script src="scrpts.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete" />
</head>
<body>
    <div class="container">
        <div class="area inicial">
            <h1>Check list</h1>
        </div>

        <div class="area preenchimento">
            <form action="" class="forms">
                <input type="text" id="campo" placeholder="Digite a tarefa aqui...">
                <button type="submit" id="add" >ADICIONAR</button>
                <button id="apagar">APAGAR TUDO</button>
            </form>
            <p id="erro">Campo vazio!</p>
        </div>

        <div class="area lista">
        </div>
    </div>
</body>
</html>
